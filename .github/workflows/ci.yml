name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.0"
      - name: Install dependencies
        run: |
          uv sync
      - name: Run ruff linter on live path
        run: |
          uv run python -m ruff check apps/gateway packages/pipeline packages/providers packages/planning packages/context packages/repository scripts

  type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.0"
      - name: Install dependencies
        run: |
          uv sync
      - name: Run mypy on live path
        run: |
          uv run python -m mypy apps/gateway packages/providers/base.py packages/providers/exceptions.py packages/providers/factory.py packages/providers/models.py packages/providers/registry.py packages/providers/registry_models.py packages/providers/router.py packages/providers/vllm.py packages/pipeline/base.py packages/pipeline/context.py packages/pipeline/engine.py packages/pipeline/exceptions.py packages/pipeline/history.py packages/pipeline/normalized.py packages/pipeline/request.py packages/pipeline/response.py packages/pipeline/result.py packages/pipeline/user_messages.py packages/pipeline/stages/model_resolution.py packages/pipeline/stages/planning_stage.py packages/pipeline/stages/repository_context.py packages/pipeline/stages/stages.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.0"
      - name: Install dependencies
        run: |
          uv sync
      - name: Run live-path tests
        run: |
          uv run python -m pytest tests/pipeline tests/gateway tests/providers tests/planning tests/context tests/repository -q
